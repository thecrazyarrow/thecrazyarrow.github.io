<!--
  404.html : shown by GitHub Pages when a link points to a page that doesn't exist.
-->
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="meta.404.title">Page not found | Aaron Angel Netto</title>
  <meta name="description" content="This page doesn't exist.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0a08">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
  <script>
    document.documentElement.classList.add('js');
    try { var l = localStorage.getItem('lang'); if (l === 'ar') { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; } else if (l === 'ja') { document.documentElement.lang = 'ja'; } } catch (e) {}
  </script>
</head>

<body>
  <div id="site-header"></div>
  <main id="main" class="container lost">
    <div>
      <p class="code">404</p>
      <h1 style="font-size:clamp(1.6rem,4vw,2.4rem); margin-block:12px" data-i18n="404.title">This part got lost in the print queue</h1>
      <p data-i18n="404.text">The page you're looking for doesn't exist, or it moved.</p>
      <div class="btn-row" style="justify-content:center">
        <a href="index.html" class="btn btn-primary" data-i18n="404.home">Back to home</a>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="assets/js/site.js" defer></script>
</body>
</html>
